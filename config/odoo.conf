[options]
; Modul inti Odoo ditemukan otomatis. Daftar di bawah: modul Nusara + repo OCA (lihat oca.lock).
addons_path = /mnt/extra-addons,/opt/oca/purchase-workflow,/opt/oca/account-financial-tools,/opt/oca/account-financial-reporting,/opt/oca/mis-builder,/opt/oca/account-budgeting,/opt/oca/server-tools,/opt/oca/account-reconcile,/opt/oca/web
data_dir = /var/lib/odoo
; Sembunyikan database manager; kata sandi admin dikirim lewat argumen --admin-passwd (dari .env).
list_db = False
; Aplikasi berjalan di belakang reverse proxy (nginx).
proxy_mode = True
