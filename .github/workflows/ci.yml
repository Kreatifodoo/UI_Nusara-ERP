name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ODOO_VERSION: "19.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Jalankan pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: nusara-erp:ci
          build-args: ODOO_VERSION=${{ env.ODOO_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Jalankan test Odoo
        run: |
          set -o pipefail
          docker run --rm --network host \
            -e HOST=localhost -e USER=odoo -e PASSWORD=odoo \
            nusara-erp:ci \
            odoo -d nusara_ci -i nusara_base \
              --test-enable --test-tags /nusara_base \
              --without-demo=all --stop-after-init --log-level=test \
            2>&1 | tee odoo-test.log
          # Odoo tidak selalu keluar dengan kode error saat test gagal, jadi periksa lognya.
          if grep -E " (ERROR|CRITICAL) " odoo-test.log; then
            echo "Test Odoo gagal: ada baris ERROR/CRITICAL di log." >&2
            exit 1
          fi
