<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purchase Request - Nusara ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    body { font-family: 'Inter', sans-serif; }
    button:disabled { opacity: .55; cursor: not-allowed; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-slate-900 text-white">
    <div class="max-w-6xl mx-auto px-4 lg:px-8 h-14 flex items-center justify-between">
      <div class="flex items-center text-lg font-bold tracking-wide">
        <span class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center mr-3">
          <i class="fas fa-layer-group text-white text-sm"></i>
        </span>
        Nusara <span class="text-indigo-400 ml-1">ERP</span>
        <span class="ml-4 text-sm font-normal text-slate-400 hidden sm:inline">Purchase Request</span>
      </div>
      <div id="session" class="text-sm text-slate-300"></div>
    </div>
  </header>

  <main id="app" class="max-w-6xl mx-auto px-4 lg:px-8 py-6" aria-live="polite"></main>
  <div id="toast" class="fixed bottom-4 right-4 z-50 space-y-2 max-w-sm"></div>

  <script type="module" src="purchase-request.js"></script>
</body>
</html>
